# Splash nativo de Cat-tionary. Regenerar con: dart run flutter_native_splash:create
# Colores alineados con el tema: crema de marca en claro y la superficie oscura de AppTheme.
flutter_native_splash:
  color: "#F6EDE3"
  color_dark: "#1A110E"
  image: assets/branding/splash_logo.png
  branding: assets/branding/branding.png
  branding_dark: assets/branding/branding_dark.png
  branding_mode: bottom
  branding_bottom_padding: 24

  # Android 12+ solo admite el ícono centrado (círculo de 192 dp) y el branding inferior.
  android_12:
    image: assets/branding/splash_android12.png
    color: "#F6EDE3"
    color_dark: "#1A110E"
    branding: assets/branding/branding.png
    branding_dark: assets/branding/branding_dark.png

  android: true
  ios: true
  web: false
